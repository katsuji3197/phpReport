<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>会員登録</title>
    <link rel="stylesheet" href="../common/css/style.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen flex-col">
    <a class="text-blue-500 hover:text-blue-300 duration-300 pb-16" href="index.php">トップページに戻る</a>
    <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md">
        <h1 class="text-2xl font-bold mb-6 text-center">会員登録</h1>
        <form action="../ctrl/entry.php" method="post" class="space-y-4">
            <div>
                <label for="full_name" class="block text-sm font-medium text-gray-700">名前<span class="text-xs text-neutral-500 px-2">20文字以内</span></label>
                <input type="text" id="full_name" name="full_name" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
            </div>
            <div>
                <label for="postal_code" class="block text-sm font-medium text-gray-700">郵便番号<span class="text-xs text-neutral-500 px-2">半角数字7ケタ、ハイフンなし</span></label>
                <input type="text" id="postal_code" name="postal_code" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" oninput="fetchAddress()">
            </div>
            <div>
                <label for="address" class="block text-sm font-medium text-gray-700">住所<span class="text-xs text-neutral-500 px-2">都道府県、市区町村、以降</span></label>
                <input type="text" id="address" name="address" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
            </div>
            <script>
                async function fetchAddress() {
                    const postalCode = document.getElementById('postal_code').value;
                    if (postalCode.length === 7) {
                        try {
                            const response = await fetch(`https://api.zipaddress.net/?zipcode=${postalCode}`);
                            const data = await response.json();
                            if (data.code === 200) {
                                document.getElementById('address').value = data.data.fullAddress;
                            } else {
                                document.getElementById('address').value = '';
                            }
                        } catch (error) {
                            console.error('Error fetching address:', error);
                            document.getElementById('address').value = '';
                        }
                    }
                }
            </script>
            <div>
                <label for="phone_number" class="block text-sm font-medium text-gray-700">電話番号<span class="text-xs text-neutral-500 px-2">半角数字12桁以内、ハイフンなし</span></label>
                <input type="text" id="phone_number" name="phone_number" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
            </div>
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700">メールアドレス<span class="text-xs text-neutral-500 px-2">半角英数記号</span></label>
                <input type="email" id="email" name="email" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
            </div>
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700">パスワード<span class="text-xs text-neutral-500 px-2">半角英数記号</span></label>
                <input type="password" id="password" name="password" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
            </div>
            <div>
                <input type="submit" value="登録" class="w-full bg-indigo-600 text-white py-2 px-4 rounded-md shadow-sm hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
            </div>
        </form>
    </div>
</body>
</html>
